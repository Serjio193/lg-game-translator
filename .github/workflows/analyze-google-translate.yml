name: Analyze latest Google Translate APK

on:
  push:
    paths:
      - '.github/workflows/analyze-google-translate.yml'
      - 'scripts/analyze-google-translate.sh'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils file jq
          python3 -m pip install --user androguard

      - name: Download and analyze
        run: bash scripts/analyze-google-translate.sh

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: google-translate-apk-analysis
          path: out/
          retention-days: 7
