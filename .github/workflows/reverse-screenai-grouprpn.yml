name: Reverse ScreenAI GroupRPN

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reverse-screenai-grouprpn.yml'
      - 'scripts/recover-grouprpn-descriptor.py'\n      - 'scripts/recover-gocr-detector-descriptor.py'

jobs:
  reverse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils ripgrep
          python3 -m pip install --quiet protobuf
      - name: Export ScreenAI
        run: |
          mkdir -p /tmp/rpn/bin /tmp/rpn/pkg /tmp/rpn/out
          curl -fsSL "https://chrome-infra-packages.appspot.com/client?platform=linux-amd64&version=latest" -o /tmp/rpn/bin/cipd
          chmod +x /tmp/rpn/bin/cipd
          printf 'chromium/third_party/screen-ai/linux latest\n' | /tmp/rpn/bin/cipd export -root /tmp/rpn/pkg -ensure-file -
          LIB=$(find /tmp/rpn/pkg -name libchromescreenai.so -print -quit)
          cp "$LIB" /tmp/rpn/out/libchromescreenai.so
          strings -a -t x "$LIB" > /tmp/rpn/out/strings-offsets.txt
          objdump -h "$LIB" > /tmp/rpn/out/sections.txt
      - name: Recover descriptor
        run: |
          cd /tmp/rpn/out
          rg -i 'GroupRpn|Pairwise|ClusterBoxes|TextFlow|Breadth gap|Height ratio|Norm dist|angle diff|group_rpn_detector|maximum_angle|maximum_breadth|GocrDetector' strings-offsets.txt > clues.txt || true
          N=$(grep -n 'GocrDetectorLevel1GroupingConfig' strings-offsets.txt | tail -1 | cut -d: -f1)
          if [ -n "$N" ]; then
            A=$((N-100)); [ $A -lt 1 ] && A=1
            B=$((N+320))
            sed -n "${A},${B}p" strings-offsets.txt > descriptor-neighborhood.txt
          fi
          python3 "$GITHUB_WORKSPACE/scripts/recover-grouprpn-descriptor.py" /tmp/rpn/out/libchromescreenai.so /tmp/rpn/out/grouprpn-descriptor\n          python3 "$GITHUB_WORKSPACE/scripts/recover-gocr-detector-descriptor.py" /tmp/rpn/out/libchromescreenai.so /tmp/rpn/out/gocr-detector-descriptor
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenai-grouprpn-reverse
          path: /tmp/rpn/out
          retention-days: 7
