name: Research Google Lens runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research-google-lens-runtime.py'
      - '.github/workflows/research-google-lens-runtime.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils binutils-aarch64-linux-gnu unzip
      - name: Download current Google App APK
        run: |
          mkdir -p /tmp/google-runtime
          curl -fL -A "Mozilla/5.0"             "https://d.apkpure.net/b/APK/com.google.android.googlequicksearchbox?version=latest"             -o /tmp/google-runtime/google.apk
      - name: Analyze native runtime
        run: |
          python3 scripts/research-google-lens-runtime.py             /tmp/google-runtime/google.apk             /tmp/google-runtime/out
      - name: Publish compact report into repository
        run: |
          mkdir -p docs/research docs/evidence/google-lens-runtime-latest
          cp /tmp/google-runtime/out/report.md docs/research/google-lens-runtime-report.md
          cp /tmp/google-runtime/out/summary.json docs/evidence/google-lens-runtime-latest/summary.json
          cp /tmp/google-runtime/out/manifest.json docs/evidence/google-lens-runtime-latest/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/google-lens-runtime-report.md docs/evidence/google-lens-runtime-latest/
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update Google Lens runtime research report"
            git push
          fi
      - name: Upload full reverse-engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-lens-runtime-research
          path: /tmp/google-runtime/out
          retention-days: 7
