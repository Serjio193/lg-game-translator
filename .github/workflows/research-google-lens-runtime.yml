name: Research Google Lens runtime

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research-google-lens-runtime.py'
      - 'scripts/recover-proto-message-descriptor.py'
      - 'scripts/research-google-runner-neighborhood.py'
      - 'scripts/research-arm64-string-xrefs.py'
      - '.github/workflows/research-google-lens-runtime.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils binutils-aarch64-linux-gnu unzip
          python3 -m pip install --quiet protobuf pyelftools capstone
      - name: Download current Google App APK
        run: |
          mkdir -p /tmp/google-runtime
          curl -fL -A "Mozilla/5.0" "https://d.apkpure.net/b/APK/com.google.android.googlequicksearchbox?version=latest" -o /tmp/google-runtime/google.apk
      - name: Analyze native runtime
        run: |
          python3 scripts/research-google-lens-runtime.py /tmp/google-runtime/google.apk /tmp/google-runtime/out
      - name: Recover runner/config protobuf descriptors
        run: |
          LIB=/tmp/google-runtime/out/libs/liblens_ondevice_engine_play_ml.so
          mkdir -p /tmp/google-runtime/out/descriptors
          python3 scripts/recover-proto-message-descriptor.py "$LIB" TensorFlowModelRunnerConfig /tmp/google-runtime/out/descriptors/tensorflow-model-runner || true
          python3 scripts/recover-proto-message-descriptor.py "$LIB" GocrDetectorGpuConfig /tmp/google-runtime/out/descriptors/gocr-detector-gpu || true
      - name: Trace GOCR runner strings and ARM64 xrefs
        run: |
          LIB=/tmp/google-runtime/out/libs/liblens_ondevice_engine_play_ml.so
          python3 scripts/research-google-runner-neighborhood.py "$LIB" /tmp/google-runtime/out/runner-neighborhood.json > /tmp/google-runtime/out/runner-neighborhood.txt
          python3 scripts/research-arm64-string-xrefs.py "$LIB" /tmp/google-runtime/out/runner-xrefs.json > /tmp/google-runtime/out/runner-xrefs.txt
          {
            echo
            echo "## Targeted runner neighborhoods"
            echo
            sed -n '1,900p' /tmp/google-runtime/out/runner-neighborhood.txt | sed 's/^/    /'
            echo
            echo "## ARM64 string xrefs"
            echo
            sed -n '1,1200p' /tmp/google-runtime/out/runner-xrefs.txt | sed 's/^/    /'
            echo
            echo "## Recovered protobuf descriptors"
            echo
            for f in /tmp/google-runtime/out/descriptors/*.txt; do
              [ -e "$f" ] || continue
              echo "### $(basename "$f")"
              sed 's/^/    /' "$f"
              echo
            done
          } >> /tmp/google-runtime/out/report.md
      - name: Publish compact report into repository
        run: |
          mkdir -p docs/research docs/evidence/google-lens-runtime-latest
          cp /tmp/google-runtime/out/report.md docs/research/google-lens-runtime-report.md
          cp /tmp/google-runtime/out/summary.json docs/evidence/google-lens-runtime-latest/summary.json
          cp /tmp/google-runtime/out/manifest.json docs/evidence/google-lens-runtime-latest/manifest.json
          cp /tmp/google-runtime/out/runner-neighborhood.txt docs/evidence/google-lens-runtime-latest/
          cp /tmp/google-runtime/out/runner-xrefs.txt docs/evidence/google-lens-runtime-latest/
          cp /tmp/google-runtime/out/runner-xrefs.json docs/evidence/google-lens-runtime-latest/
          for f in /tmp/google-runtime/out/descriptors/*.txt; do
            [ -e "$f" ] || continue
            cp "$f" docs/evidence/google-lens-runtime-latest/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/google-lens-runtime-report.md docs/evidence/google-lens-runtime-latest/
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Update Google Lens runtime research report"
            git push
          fi
      - name: Upload full reverse-engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-lens-runtime-research
          path: /tmp/google-runtime/out
          retention-days: 7
