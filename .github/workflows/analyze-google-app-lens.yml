name: Analyze Google App Lens detector

on:
  push:
    paths:
      - '.github/workflows/analyze-google-app-lens.yml'
      - 'scripts/analyze-google-app-lens.sh'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip binutils file jq
          python3 -m pip install --user androguard
      - name: Analyze Google App
        run: bash scripts/analyze-google-app-lens.sh
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: google-app-lens-analysis
          path: out-google-app/reports/
          retention-days: 7
