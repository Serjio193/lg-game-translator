name: build-webos-probe

on:
  push:
    branches: [capture-probe, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build curl xz-utils file npm
          npm install -g @webos-tools/cli@3.2.6

      - name: Download webOS buildroot toolchain
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fL -o webos-sdk.tar.gz \
            https://github.com/openlgtv/buildroot-nc4/releases/download/webos-b17b4cc/arm-webos-linux-gnueabi_sdk-buildroot.tar.gz
          tar -xzf webos-sdk.tar.gz
          /tmp/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
          test -f /tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake

      - name: Cross-compile ARM probe
        shell: bash
        run: |
          export TOOLCHAIN_FILE=/tmp/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake
          sh ./scripts/build-webos.sh
          file build/webos/lg-game-capture-probe
          file build/webos/lg-game-capture-probe | grep -E 'ARM|arm'

      - name: Stage TV files
        run: |
          mkdir -p build/artifact
          cp build/webos/lg-game-capture-probe build/artifact/
          cp probe/env-probe.sh build/artifact/
          cp packaging/appinfo.json packaging/index.html build/artifact/
          chmod +x build/artifact/lg-game-capture-probe build/artifact/env-probe.sh

      - name: Package installable IPK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ipk-app build/ipk-out
          cp packaging/appinfo.json packaging/index.html build/ipk-app/
          cp build/webos/lg-game-capture-probe probe/env-probe.sh build/ipk-app/
          chmod +x build/ipk-app/lg-game-capture-probe build/ipk-app/env-probe.sh
          # appinfo currently names an icon we do not ship; remove that optional field for this probe package.
          python3 -c 'import json; p="build/ipk-app/appinfo.json"; d=json.load(open(p)); d.pop("icon",None); open(p,"w").write(json.dumps(d,indent=2)+"\\n")'
          ares-package build/ipk-app -o build/ipk-out
          ls -lh build/ipk-out/*.ipk
          file build/ipk-out/*.ipk

      - name: Upload ARM probe
        uses: actions/upload-artifact@v4
        with:
          name: lg-game-translator-webos-probe
          path: |
            build/artifact/
            build/ipk-out/*.ipk
