<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>LG Game Translator</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #10151d; color: #eff4fb; }
    main { max-width: 900px; margin: 0 auto; padding: 28px 20px; }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    p { color: #b4c0cf; }
    .panel { margin-top: 20px; padding: 18px; background: #1b2430; border: 1px solid #344354; border-radius: 12px; }
    .switch { display: inline-flex; gap: 4px; padding: 4px; background: #10151d; border-radius: 10px; }
    button, input, textarea { font: inherit; }
    button { border: 0; border-radius: 8px; padding: 11px 16px; color: #dce6f2; background: #2a3747; cursor: pointer; }
    button[aria-pressed="true"] { color: white; background: #315ed8; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    textarea { box-sizing: border-box; width: 100%; min-height: 120px; resize: vertical; padding: 12px; color: #f4f7fb; background: #10151d; border: 1px solid #425367; border-radius: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .muted, #status { font-size: .92rem; color: #b4c0cf; }
    #output { min-height: 54px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    #translate { margin-top: 12px; color: white; background: #168567; font-weight: 650; }
    details { margin-top: 14px; color: #b4c0cf; }
    details input { width: min(100%, 420px); padding: 8px; color: white; background: #10151d; border: 1px solid #425367; border-radius: 6px; }
    .error { color: #ffb4ab !important; }
  </style>
</head>
<body>
<main>
  <h1>LG Game Translator</h1>
  <p>Проверка выбора переводчика. Пока OCR не подключён — сюда можно вставить распознанную строку вручную.</p>

  <section class="panel" aria-labelledby="provider-title">
    <div class="row">
      <div>
        <strong id="provider-title">Переводчик</strong>
        <div class="muted" id="provider-status">Проверяю Orange Pi…</div>
      </div>
      <div class="switch" role="group" aria-label="Выбор переводчика">
        <button id="madlad-mode" type="button" aria-pressed="true">MADLAD · Orange Pi</button>
        <button id="google-mode" type="button" aria-pressed="false">Google Cloud</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <label for="source"><strong>Текст на английском</strong></label>
    <textarea id="source" maxlength="4000" placeholder="Вставь сюда результат OCR…"></textarea>
    <div class="row">
      <button id="translate" type="button">Перевести</button>
      <span id="status" role="status" aria-live="polite">Ожидаю текст.</span>
    </div>
  </section>

  <section class="panel" aria-labelledby="result-title">
    <div class="row"><strong id="result-title">Перевод</strong><span class="muted" id="timing"></span></div>
    <p id="output">Здесь появится русский перевод.</p>
  </section>

  <details>
    <summary>Адрес Orange Pi</summary>
    <p><input id="api-base" type="url" aria-label="Адрес API Orange Pi"></p>
    <button id="save-api" type="button">Сохранить адрес</button>
  </details>
</main>
<script>
(() => {
  const defaultApi = "http://192.168.1.11:8765";
  const savedApi = localStorage.getItem("translator-api-base");
  const hostedApi = location.protocol === "http:" || location.protocol === "https:"
    ? location.origin : defaultApi;
  const apiBase = document.getElementById("api-base");
  const status = document.getElementById("status");
  const providerStatus = document.getElementById("provider-status");
  const output = document.getElementById("output");
  const timing = document.getElementById("timing");
  const madladButton = document.getElementById("madlad-mode");
  const googleButton = document.getElementById("google-mode");
  let provider = "madlad";
  let capabilities = { madlad: { available: false }, google: { available: false } };

  apiBase.value = savedApi || hostedApi;
  const baseUrl = () => apiBase.value.trim().replace(/\/+$/, "");
  function chooseProvider(next) {
    provider = next;
    madladButton.setAttribute("aria-pressed", String(next === "madlad"));
    googleButton.setAttribute("aria-pressed", String(next === "google"));
    const ready = capabilities[next]?.available;
    providerStatus.textContent = next === "google" && !ready
      ? "Google выбран, но на Orange Pi ещё не настроен GOOGLE_API_KEY."
      : next === "madlad" && !ready
        ? "MADLAD не отвечает. Проверь сервис Orange Pi."
        : next === "madlad" ? "Локальный перевод · Orange Pi 5 Max"
          : "Онлайн-перевод · Google Cloud";
    providerStatus.classList.toggle("error", !ready);
  }

  async function refreshStatus() {
    try {
      const response = await fetch(baseUrl() + "/api/status", { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);
      capabilities = await response.json();
      chooseProvider(provider);
    } catch (error) {
      providerStatus.textContent = "Нет связи с API Orange Pi: " + error.message;
      providerStatus.classList.add("error");
    }
  }

  madladButton.addEventListener("click", () => chooseProvider("madlad"));
  googleButton.addEventListener("click", () => chooseProvider("google"));
  document.getElementById("save-api").addEventListener("click", () => {
    localStorage.setItem("translator-api-base", baseUrl());
    status.textContent = "Адрес сохранён.";
    refreshStatus();
  });
  document.getElementById("translate").addEventListener("click", async () => {
    const text = document.getElementById("source").value.trim();
    if (!text) { status.textContent = "Вставь английский текст."; return; }
    status.classList.remove("error");
    status.textContent = "Перевожу…";
    timing.textContent = "";
    output.textContent = "";
    try {
      const response = await fetch(baseUrl() + "/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider, text })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "HTTP " + response.status);
      output.textContent = result.translation;
      timing.textContent = result.latency_ms + " мс" +
        (result.generated_tokens ? " · " + result.generated_tokens + " токенов" : "");
      status.textContent = provider === "madlad" ? "Перевёл локально." : "Перевёл Google Cloud.";
    } catch (error) {
      status.textContent = error.message;
      status.classList.add("error");
    }
  });
  refreshStatus();
})();
</script>
</body>
</html>
